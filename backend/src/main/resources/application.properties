# ==============================================================================
# SMART COMPLAINT AND GRIEVANCE PORTAL - APPLICATION CONFIGURATION
# ==============================================================================

spring.application.name=grievance-backend
server.port=8080

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION: H2 (Default: Instant Zero-Config Run in Eclipse / STS)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:grievancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (Access in browser at: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# MYSQL CONFIGURATION (OPTIONAL: Uncomment if using MySQL instead of H2)
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/grievance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=root123
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# JPA / HIBERNATE SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

