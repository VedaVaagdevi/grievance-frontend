<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Smart Complaint and Grievance Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <a class="auth-brand" href="index.html"><span id="logo"></span> Smart Complaint &amp; Grievance Portal</a>

  <div class="auth-box card">
    <h2>Create account</h2>
    <span class="muted">Register to raise and track your complaints</span>

    <form id="regForm">
      <label>Full name</label>
      <input id="rName" placeholder="Your full name" required>
      <label>Email address</label>
      <input id="rEmail" type="email" placeholder="you@college.edu" required>
      <label>Password</label>
      <input id="rPass" type="password" placeholder="Minimum 6 characters" minlength="6" required>
      <button class="btn" type="submit">Create account</button>
    </form>

    <p id="msg" class="msg"></p>
    <p class="switch">Already registered? <a href="login.html">Login</a></p>
  </div>

  <a class="back" href="index.html">&larr; Back to home</a>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
