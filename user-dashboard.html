<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard - Smart Complaint and Grievance Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand"><span id="logo"></span><b>Smart Complaint &amp; Grievance Portal</b></div>
    <div class="right">
      <span>Hello, <b id="uname"></b></span>
      <button class="btn btn-light btn-sm" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="welcome"><h2 id="welcomeName">Welcome</h2>
      <p>Register your complaints, track their progress in real time and read the admin's remarks here.</p></div>

    <div class="stats" id="stats"></div>

    <div class="grid2">
      <section class="card">
        <h3>Raise a Complaint</h3>
        <form id="cForm">
          <label>Title</label>
          <input id="cTitle" placeholder="Short summary of the issue" required>
          <div class="row" style="align-items:flex-start">
            <div style="flex:1;min-width:140px"><label>Category</label><select id="cCategory" required></select></div>
            <div style="flex:1;min-width:140px"><label>Department</label><select id="cDept" required></select></div>
          </div>
          <label>Description</label>
          <textarea id="cDesc" placeholder="Type your complaint, or use the microphone to speak" required></textarea>
          <div class="row">
            <button class="btn" type="submit">Submit Complaint</button>
            <button class="btn btn-light" type="button" id="micBtn">&#127908; Speak</button>
          </div>
        </form>
        <p id="cMsg" class="msg"></p>
      </section>

      <section class="card">
        <h3>Track by Complaint ID</h3>
        <div class="row">
          <input id="trackId" type="number" min="1" placeholder="Enter Complaint ID">
          <button class="btn" id="trackBtn" type="button">Track</button>
        </div>
        <div id="trackOut" style="margin-top:14px"></div>
      </section>
    </div>

    <section class="card">
      <div class="row between">
        <h3 style="margin:0">My Complaints</h3>
        <div class="row">
          <input id="q" placeholder="Search by title or ID">
          <select id="fStatus"></select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Department</th><th>Status</th><th>Date</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Detail modal -->
  <div class="modal hidden" id="detailModal" onclick="if(event.target===this)closeDetail()">
    <div class="card box">
      <button class="close" onclick="closeDetail()" aria-label="Close">&times;</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/user.js"></script>
</body>
</html>
